<!doctype html>
<html lang="fr">
  <meta charset="utf-8">
  <title>Beast Academy en français</title>
  <link rel="stylesheet" href="popup.css">
  <main>
    <h1>Beast Academy en français</h1>
    <section id="consent" lang="en" aria-label="First-use privacy notice" hidden>
      <p>To translate a lesson, this extension reads the visible text and captures the visible area of your Beast Academy tab. The screenshot and text are processed on your device. Allow this when you start a translation?</p>
      <div class="consent-actions">
        <button id="allow">Allow and translate</button>
        <button id="cancel" class="secondary">Cancel</button>
      </div>
    </section>
    <button id="scan" hidden>Préparer la traduction</button>
    <p id="status" role="status" aria-live="polite">Préparation de la traduction…</p>
  </main>
  <script src="ocr/tesseract.min.js"></script>
  <script type="module" src="popup.mjs"></script>
</html>
