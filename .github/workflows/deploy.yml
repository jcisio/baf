name: Deploy BAF website

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.jcisio.com/baf/
    concurrency:
      group: baf-website
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare site and download release ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Expected a release tag such as v0.1.1.' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          archive="beast-academy-en-francais-$version.zip"
          deploy_dir="$RUNNER_TEMP/baf"
          mkdir "$deploy_dir"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive" --dir "$deploy_dir"
          unzip -tq "$deploy_dir/$archive"
          test "$(unzip -p "$deploy_dir/$archive" manifest.json | jq -er .version)" = "$version"
          sed "s/@@VERSION@@/$version/g" site/index.html > "$deploy_dir/index.html"
          cp site/privacy.html site/site.css "$deploy_dir/"
      - name: Upload over SSH
        env:
          BAF_DEPLOY_KEY: ${{ secrets.BAF_DEPLOY_KEY }}
          BAF_SSH_KNOWN_HOSTS: ${{ vars.BAF_SSH_KNOWN_HOSTS }}
        run: |
          set -o pipefail
          umask 077
          key_dir=$(mktemp -d "$RUNNER_TEMP/baf-ssh.XXXXXXXX")
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$BAF_DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$BAF_SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          archive="beast-academy-en-francais-${RELEASE_TAG#v}.zip"
          tar --format=ustar -C "$RUNNER_TEMP/baf" -cf - index.html privacy.html site.css "$archive" |
            ssh -T -i "$key_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
              hainam@jcisio.com "baf-deploy $RELEASE_TAG"
      - name: Verify public files
        run: |
          set -o pipefail
          archive="beast-academy-en-francais-${RELEASE_TAG#v}.zip"
          for file in index.html privacy.html site.css "$archive"; do
            curl -fsS --retry 3 "https://dev.jcisio.com/baf/$file" |
              cmp - "$RUNNER_TEMP/baf/$file"
          done
