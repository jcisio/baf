name: Deploy BAF website

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      BAF_DEPLOY_KEY:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: https://dev.jcisio.com/baf/
    concurrency:
      group: baf-website
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare site and verify the GitHub downloads
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' 'Expected a release tag such as v0.1.1.' >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          archive="beast-academy-en-francais-$version.zip"
          release_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$archive"
          curl --fail --silent --show-error --location --head --retry 3 --max-time 30 "$release_url" >/dev/null
          firefox_url="${release_url%.zip}-firefox.zip"
          firefox_content=()
          case "$RELEASE_TAG" in
            v0.1.1|v0.1.2)
              firefox_content=(-e '/<section .*id="install-firefox"/,/<\/section>/d')
              ;;
            *)
              curl --fail --silent --show-error --location --head --retry 3 --max-time 30 "$firefox_url" >/dev/null
              ;;
          esac
          deploy_dir="$RUNNER_TEMP/baf"
          mkdir "$deploy_dir"
          css_version=$(sha256sum site/site.css | cut -c 1-12)
          stylesheet="s|href=\"site.css\"|href=\"site.css?v=$css_version\"|"
          media="$RUNNER_TEMP/baf-media.sed"
          # Embed the media within the SSH receiver's existing file allowlist.
          embed_media() {
            printf 's|src="%s"|src="data:%s;base64,%s"|g\n' \
              "${1#site/}" "$2" "$(base64 < "$1" | tr -d '\n')"
          }
          {
            for image in site/tutorial/*.jpg; do
              embed_media "$image" image/jpeg
            done
            embed_media site/baf-icon.png image/png
            embed_media site/tutorial/chrome-walkthrough.mp4 video/mp4
          } > "$media"
          for page in index.html fr.html privacy.html privacy-fr.html; do
            sed "${firefox_content[@]}" -e "$stylesheet" -e "s/@@VERSION@@/$version/g" \
              -e "s|@@RELEASE_URL@@|$release_url|g" -e "s|@@FIREFOX_RELEASE_URL@@|$firefox_url|g" \
              -f "$media" \
              "site/$page" > "$deploy_dir/$page"
            if [[ $(wc -c < "$deploy_dir/$page") -gt 1048576 ]]; then
              printf '%s\n' "Rendered $page exceeds the 1 MiB upload limit." >&2
              exit 1
            fi
          done
          cp site/site.css site/math-glossary-en-fr.pdf "$deploy_dir/"
      - name: Upload over SSH
        timeout-minutes: 1
        env:
          BAF_DEPLOY_KEY: ${{ secrets.BAF_DEPLOY_KEY }}
          BAF_SSH_KNOWN_HOSTS: ${{ vars.BAF_SSH_KNOWN_HOSTS }}
        run: |
          set -o pipefail
          umask 077
          key_dir=$(mktemp -d "$RUNNER_TEMP/baf-ssh.XXXXXXXX")
          trap 'rm -rf "$key_dir"' EXIT
          test -n "$BAF_DEPLOY_KEY"
          printf '%s\n' "$BAF_DEPLOY_KEY" > "$key_dir/key"
          printf '%s\n' "$BAF_SSH_KNOWN_HOSTS" > "$key_dir/known_hosts"
          tar --format=ustar -C "$RUNNER_TEMP/baf" -cf - index.html fr.html privacy.html privacy-fr.html site.css math-glossary-en-fr.pdf |
            ssh -T -i "$key_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes -o ConnectTimeout=10 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$key_dir/known_hosts" \
              hainam@jcisio.com "baf-deploy $RELEASE_TAG"
      - name: Verify public files
        run: |
          set -o pipefail
          for file in index.html fr.html privacy.html privacy-fr.html site.css math-glossary-en-fr.pdf; do
            curl -fsS --retry 3 --connect-timeout 8 --max-time 20 --retry-max-time 30 "https://dev.jcisio.com/baf/$file" |
              cmp - "$RUNNER_TEMP/baf/$file"
          done
