name: Build extension release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    concurrency:
      group: baf-release-${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify tag version
        run: |
          version=$(node -p "require('./extension/manifest.json').version")
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s must match the manifest version v%s.\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi
      - name: Build and test
        run: |
          npm ci --ignore-scripts
          npm test
          npm run build
          npm run build:firefox
      - name: Package and verify both extensions
        run: |
          version="${RELEASE_TAG#v}"
          chrome="$RUNNER_TEMP/beast-academy-en-francais-$version.zip"
          firefox="$RUNNER_TEMP/beast-academy-en-francais-$version-firefox.zip"
          (cd dist && zip -qr "$chrome" .)
          (cd dist-firefox && zip -qr "$firefox" .)
          for archive in "$chrome" "$firefox"; do
            unzip -tq "$archive"
            actual=$(unzip -p "$archive" manifest.json | jq -er .version)
            test "$actual" = "$version"
            unzip -p "$archive" ocr/eng.traineddata.gz | gzip -t
          done
          unzip -p "$chrome" manifest.json | jq -e 'has("minimum_chrome_version")'
          unzip -p "$firefox" manifest.json | jq -e '.browser_specific_settings.gecko | has("strict_min_version")'
          unzip -p "$firefox" bergamot/worker/bergamot-translator-worker.wasm >/dev/null
          unzip -p "$firefox" bergamot/model.enfr.intgemm.alphas.bin >/dev/null
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${RELEASE_TAG#v}"
          chrome="$RUNNER_TEMP/beast-academy-en-francais-$version.zip"
          firefox="$RUNNER_TEMP/beast-academy-en-francais-$version-firefox.zip"
          if release=$(gh release view "$RELEASE_TAG" --json isDraft,assets); then
            jq -e '.isDraft == false' <<< "$release" >/dev/null
            existing_dir=$(mktemp -d "$RUNNER_TEMP/baf-release.XXXXXXXX")
            missing=()
            verify_or_stage_asset() {
              local archive="$1" build_dir="$2"
              local name="${archive##*/}"
              if jq -e --arg name "$name" 'any(.assets[]; .name == $name)' <<< "$release" >/dev/null; then
                gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing_dir"
                unzip -q "$existing_dir/$name" -d "$existing_dir/$build_dir"
                diff -qr "$build_dir" "$existing_dir/$build_dir"
              else
                missing+=("$archive")
              fi
            }
            verify_or_stage_asset "$chrome" dist
            verify_or_stage_asset "$firefox" dist-firefox
            if (( ${#missing[@]} )); then
              gh release upload "$RELEASE_TAG" "${missing[@]}"
            fi
          else
            gh release create "$RELEASE_TAG" "$chrome" "$firefox" --verify-tag --generate-notes
          fi
  deploy:
    needs: release
    uses: ./.github/workflows/deploy.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets:
      BAF_DEPLOY_KEY: ${{ secrets.BAF_DEPLOY_KEY }}
